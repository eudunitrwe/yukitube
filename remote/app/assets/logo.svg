<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- The YukiTube logo: Yuki the cat in front of the retrowave sun, over the
       neon grid, in the app's colors. Every icon is rendered from this file
       (remote/tools/make_icons.py), and the remote draws it at runtime. -->
  <defs>
    <linearGradient id="bg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="1024">
      <stop offset="0" stop-color="#12022b"/><stop offset="0.55" stop-color="#3a0a5e"/><stop offset="1" stop-color="#14031f"/>
    </linearGradient>
    <linearGradient id="sun" gradientUnits="userSpaceOnUse" x1="0" y1="110" x2="0" y2="650">
      <stop offset="0" stop-color="#ffd319"/><stop offset="0.5" stop-color="#ff901f"/><stop offset="1" stop-color="#ff2a6d"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff2a6d"/><stop offset="1" stop-color="#05d9e8"/>
    </linearGradient>
    <radialGradient id="halo" gradientUnits="userSpaceOnUse" cx="512" cy="420" r="430">
      <stop offset="0.55" stop-color="#ff2a6d" stop-opacity="0.35"/><stop offset="1" stop-color="#ff2a6d" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect x="20" y="20" width="984" height="984" rx="225"/></clipPath>
    <path id="sil" d="M165 180 L185 30 L268 118 Q300 108 332 118 L415 30 L435 180 Q462 240 440 300 C520 450 545 700 495 860 L105 860 C55 700 80 450 160 300 Q138 240 165 180 Z"/>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <!-- sun, with stripes in the background's own colour, cut to its outline -->
    <circle cx="512" cy="420" r="430" fill="url(#halo)"/>
    <circle cx="512" cy="420" r="300" fill="url(#sun)"/>
    <g fill="url(#bg)">
      <path d="M215.9 468 L808.1 468 A300 300 0 0 1 805.9 480 L218.1 480 A300 300 0 0 1 215.9 468 Z"/>
      <path d="M224.3 505 L799.7 505 A300 300 0 0 1 794.1 522 L229.9 522 A300 300 0 0 1 224.3 505 Z"/>
      <path d="M240.2 547 L783.8 547 A300 300 0 0 1 771.8 570 L252.2 570 A300 300 0 0 1 240.2 547 Z"/>
      <path d="M268.3 595 L755.7 595 A300 300 0 0 1 731.0 625 L293.0 625 A300 300 0 0 1 268.3 595 Z"/>
    </g>
    <!-- floor and grid -->
    <rect x="0" y="650" width="1024" height="374" fill="#140228" fill-opacity="0.92"/>
    <g stroke="#ff2a6d" stroke-width="10" stroke-opacity="0.9">
      <line x1="512" y1="650" x2="-560" y2="1024"/><line x1="512" y1="650" x2="-120" y2="1024"/>
      <line x1="512" y1="650" x2="250" y2="1024"/><line x1="512" y1="650" x2="774" y2="1024"/>
      <line x1="512" y1="650" x2="1144" y2="1024"/><line x1="512" y1="650" x2="1584" y2="1024"/>
      <line x1="0" y1="690" x2="1024" y2="690"/><line x1="0" y1="755" x2="1024" y2="755"/>
      <line x1="0" y1="850" x2="1024" y2="850"/><line x1="0" y1="975" x2="1024" y2="975"/>
    </g>
    <line x1="0" y1="650" x2="1024" y2="650" stroke="#05d9e8" stroke-width="18"/>

    <!-- Yuki -->
    <g transform="translate(122,118) scale(1.3)">
      <use xlink:href="#sil" fill="none" stroke="url(#neon)" stroke-width="34" stroke-opacity="0.35" stroke-linejoin="round"/>
      <use xlink:href="#sil" fill="none" stroke="url(#neon)" stroke-width="14" stroke-linejoin="round"/>
      <use xlink:href="#sil" fill="#04040b"/>
      <path d="M190 60 L210 150 L255 115 Z M410 60 L390 150 L345 115 Z" fill="#2a1a2e"/>
      <path d="M230 318 Q300 372 370 318 Q382 470 300 600 Q218 470 230 318 Z" fill="#fbf0fb"/>
      <path d="M262 262 Q300 244 338 262 Q346 300 300 306 Q254 300 262 262 Z" fill="#fbf0fb"/>
      <path d="M288 252 L312 252 L300 266 Z" fill="#ef637e"/>
      <ellipse cx="240" cy="205" rx="30" ry="34" fill="#e8a33a"/><ellipse cx="360" cy="205" rx="30" ry="34" fill="#e8a33a"/>
      <ellipse cx="240" cy="205" rx="9" ry="27" fill="#04040b"/><ellipse cx="360" cy="205" rx="9" ry="27" fill="#04040b"/>
      <circle cx="249" cy="192" r="6" fill="#fbf0fb"/><circle cx="369" cy="192" r="6" fill="#fbf0fb"/>
      <g stroke="#e6dcf0" stroke-width="4" stroke-opacity="0.85" stroke-linecap="round">
        <line x1="250" y1="275" x2="120" y2="255"/><line x1="250" y1="285" x2="115" y2="295"/>
        <line x1="350" y1="275" x2="480" y2="255"/><line x1="350" y1="285" x2="485" y2="295"/>
      </g>
    </g>
  </g>
  <rect x="20" y="20" width="984" height="984" rx="225" fill="none" stroke="url(#neon)" stroke-width="30"/>
</svg>
